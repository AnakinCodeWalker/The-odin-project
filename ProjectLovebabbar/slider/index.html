<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
</head>
<body>
    <div class="container">

<h1>Password Generator</h1>

<div class="display-container">
    <input readonly placeholder="Password" class="display" data-passwordDisplay>

<button data-copy>
    <span data-copyMsg> </span>
    <img src="" alt="">
</button>
    </div>

    <div class="input-container">
        <div class="length-container">
            <p>Password Length</p>
            <p data-lengthNumber>0</p>
        </div>
     
     
        <!-- slider -->
        <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider>
       
       
        <!-- check boxes -->
         <div ><input type="checkbox" id="uppercase">
        <label for="uppercase">Includes Uppercase letters</label></div>
    </div>



     <div ><input type="checkbox" id="lowercase">
        <label for="lowercase">Includes lowercase letters</label></div>
    </div>


     <div ><input type="checkbox" id="numbers">
        <label for="numbers">Includes numbers letters</label></div>
    </div>


     <div ><input type="checkbox" id="symbols">
        <label for="symbols">Includes symbols letters</label></div>
    </div>

<!-- strength section -->
<div class="strength-container">
<p>Strength</p>
<div data-indicator></div>
</div>

<button class="generatebutton">
    Generate Password</button>

    </div>
    <script src="script.js"></script>
</body>
</html>
